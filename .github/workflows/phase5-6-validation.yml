name: Phase 5–6 Validation

on:
  push:
    branches: [main]
    paths:
      - 'reference/project-automation/**'
      - 'reference/hermes-governance/**'
      - 'schemas/project-automation-*.schema.json'
      - 'schemas/hermes-*.schema.json'
      - 'policies/phase5-project-automation.md'
      - 'policies/hermes-learning.md'
      - 'hermes/**'
      - 'compose.yaml'
      - '.env.example'
      - '.github/workflows/phase5-6-validation.yml'
  pull_request:
    paths:
      - 'reference/project-automation/**'
      - 'reference/hermes-governance/**'
      - 'schemas/project-automation-*.schema.json'
      - 'schemas/hermes-*.schema.json'
      - 'hermes/**'
      - 'compose.yaml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [project-automation, hermes-governance]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: reference/${{ matrix.service }}/package-lock.json
      - run: npm ci
        working-directory: reference/${{ matrix.service }}
      - run: npm run typecheck
        working-directory: reference/${{ matrix.service }}
      - run: npm test
        working-directory: reference/${{ matrix.service }}
      - run: npm run build
        working-directory: reference/${{ matrix.service }}

  contracts-and-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Phase 5–6 JSON schemas
        run: |
          node -e "for (const f of require('fs').readdirSync('schemas').filter(f => /^(project-automation|hermes-).*\.schema\.json$/.test(f))) JSON.parse(require('fs').readFileSync('schemas/' + f, 'utf8'))"
      - name: Validate Compose configuration
        run: cp .env.example .env && docker compose config --quiet
      - name: Build local services
        run: docker compose build phase5-project-automation phase6-hermes-governance
      - name: Docker smoke test
        run: |
          docker compose up -d postgres phase5-project-automation phase6-hermes-governance
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8085/healthz >/dev/null \
              && curl --fail --silent http://localhost:8086/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Stop Docker smoke stack
        if: always()
        run: docker compose down -v --remove-orphans
