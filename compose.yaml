name: ${COMPOSE_PROJECT_NAME:-engineering-governance}

# Four long-running services. Hermes is the execution plane: reasoning,
# orchestration, scheduling and formatting. governance-mcp is the deterministic
# boundary: it holds every provider credential and owns approval, quality
# verification, Git authority and delivery guarantees. See
# decisions/adr/global/ADR-GLOBAL-010-hermes-first-consolidation.md

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [backend]
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  deploy:
    resources:
      limits: { cpus: "1.00", memory: 1G }

services:
  caddy:
    <<: *service-defaults
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443"]
    environment: { PUBLIC_DOMAIN: "${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}", ACME_EMAIL: "${ACME_EMAIL:-}" }
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    networks: [edge, backend]
    depends_on: { hermes: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost/healthz"], interval: 10s, timeout: 3s, retries: 10 }

  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    environment: { POSTGRES_DB: "${POSTGRES_DB:?required}", POSTGRES_USER: "${POSTGRES_USER:?required}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}" }
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 5s, timeout: 3s, retries: 20 }

  # Compatibility provider boundary. Direct provider MCP connectors may replace
  # this service after migration and must own their own scoped credentials.
  governance-mcp:
    <<: *service-defaults
    build: { context: ./reference/governance-mcp }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GOVERNANCE_MCP_PORT: 8090
      GOVERNANCE_MCP_TOKEN: ${GOVERNANCE_MCP_TOKEN:?required}
      GOVERNANCE_ROOT: /governance
      AGENT_WORKSPACE_ROOT: /workspaces
      JOB_TOKEN_SIGNING_SECRET: ${JOB_TOKEN_SIGNING_SECRET:?required}
      PRINCIPAL_SIGNING_SECRET: ${PRINCIPAL_SIGNING_SECRET:?required}
      LINE_IDENTITIES_JSON: ${LINE_IDENTITIES_JSON:?required}
      JIRA_BASE_URL: ${JIRA_BASE_URL:?required}
      JIRA_EMAIL: ${JIRA_EMAIL:?required}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:?required}
      JIRA_AI_ASSIGNEE_ACCOUNT_IDS: ${JIRA_AI_ASSIGNEE_ACCOUNT_IDS:?required}
      JIRA_AI_PRIMARY_ASSIGNEE_ACCOUNT_ID: ${JIRA_AI_PRIMARY_ASSIGNEE_ACCOUNT_ID:?required}
      JIRA_ALLOWED_PROJECT_KEYS: ${JIRA_ALLOWED_PROJECT_KEYS:?required}
      JIRA_COMPONENT_FIELD_ID: ${JIRA_COMPONENT_FIELD_ID:-}
      JIRA_WORK_TYPE_FIELD_ID: ${JIRA_WORK_TYPE_FIELD_ID:-}
      JIRA_STATUS_MAPPINGS_JSON: ${JIRA_STATUS_MAPPINGS_JSON:-{}}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?required}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:?required}
      LINE_DELIVERY_TARGET_IDS: ${LINE_DELIVERY_TARGET_IDS:?required}
      LINE_ALERT_TARGET_ID: ${LINE_ALERT_TARGET_ID:?required}
      LINE_HOME_CHANNEL: ${LINE_HOME_CHANNEL:?required}
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      QUALITY_GATE_TIMEOUT_MS: ${QUALITY_GATE_TIMEOUT_MS:-900000}
      REPORT_MAX_ATTEMPTS: ${REPORT_MAX_ATTEMPTS:-8}
      TZ: ${TZ:-Asia/Bangkok}
    volumes: ["./:/governance:ro", "agent-workspaces:/workspaces"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"], interval: 10s, timeout: 3s, retries: 15 }

  # The execution plane. Hermes connects through the provider-facing MCP
  # endpoint; the default endpoint is the governance-mcp compatibility path.
  # Provider credentials remain isolated inside the MCP connector boundary.
  hermes:
    <<: *service-defaults
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent@sha256:071a7e5e6787156d1469ad04088cdbc0ce3db25d2727cb5a4e3958e3c57aa8f7}
    command: gateway run
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${HERMES_API_KEY:?required}
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      HERMES_WRITE_SAFE_ROOT: /opt/data:/workspaces
      HERMES_PROVIDER_MCP_URL: ${HERMES_PROVIDER_MCP_URL:-http://governance-mcp:8090}
      HERMES_PROVIDER_MCP_TOKEN: ${HERMES_PROVIDER_MCP_TOKEN:-${GOVERNANCE_MCP_TOKEN}}
      GOVERNANCE_MCP_TOKEN: ${GOVERNANCE_MCP_TOKEN:?required}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:?required}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:?required}
      LINE_PORT: 8646
      LINE_PUBLIC_URL: https://${PUBLIC_DOMAIN}
      LINE_ALLOWED_USERS: ${LINE_ALLOWED_USERS:?required}
      LINE_ALLOWED_GROUPS: ${LINE_ALLOWED_GROUPS:-}
      LINE_ALLOW_ALL_USERS: "false"
      LINE_HOME_CHANNEL: ${LINE_HOME_CHANNEL:?required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TZ: ${TZ:-Asia/Bangkok}
    volumes:
      - "hermes-data:/opt/data"
      - "./hermes/skills/engineering-governance:/opt/data/skills/engineering-governance:ro"
      - "./hermes/skills/ai-sdlc-execution:/opt/data/skills/ai-sdlc-execution:ro"
      - "./hermes/skills/rpa-reporting:/opt/data/skills/rpa-reporting:ro"
      - "generated-skills:/opt/data/skills/generated:ro"
      - "agent-workspaces:/workspaces"
      - "../../../product-information:/workspaces/product-information"
      - "./:/governance:ro"
    depends_on:
      hermes-data-init: { condition: service_completed_successfully }
      governance-mcp: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8642/health"], interval: 15s, timeout: 5s, retries: 12 }

  hermes-data-init:
    image: alpine:3.22
    restart: "no"
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    user: root
    # config.yaml is redeployed every start; cron/jobs.json is seeded only when
    # absent, because Hermes rewrites it at runtime and an operator's pause or
    # revoke of a schedule must survive a restart.
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /hermes/skills /hermes/cron
        cp /seed/config.yaml /hermes/config.yaml
        [ -f /hermes/cron/jobs.json ] || cp /seed/jobs.json /hermes/cron/jobs.json
        chown -R ${HERMES_UID:-10000}:${HERMES_GID:-10000} /hermes
    environment: { HERMES_UID: "${HERMES_UID:-10000}", HERMES_GID: "${HERMES_GID:-10000}" }
    volumes:
      - "hermes-data:/hermes"
      - "./hermes/config.yaml:/seed/config.yaml:ro"
      - "./hermes/cron/jobs.json:/seed/jobs.json:ro"
    networks: [backend]

networks: { edge: {}, backend: {} }
volumes:
  postgres-data: {}
  generated-skills: {}
  agent-workspaces: {}
  hermes-data: {}
  caddy-data: {}
  caddy-config: {}
