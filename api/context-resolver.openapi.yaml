openapi: 3.1.0
info:
  title: Vespiario Effective Context Resolver
  version: 1.0.0
  description: >-
    Canonical AI SDLC context boundary. Responses are computed views and do not
    replace authoritative Jira, GitHub, ADR/BDR, policy, or runtime sources.
servers:
  - url: https://context-resolver.internal
paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Liveness check for the Context Resolver HTTP service
      responses:
        '200':
          description: Service process is alive.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    const: ok
  /v1/context/resolve:
    post:
      operationId: resolveContext
      summary: Resolve effective context for a Jira issue or project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/context-resolve-request.schema.json
      responses:
        '200':
          description: Effective context resolved, possibly with blocking conflicts.
          content:
            application/json:
              schema:
                $ref: ../schemas/effective-context.schema.json
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project/Jira identity could not be mapped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Required authoritative source is unavailable and safe resolution cannot continue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/projects/{projectId}/context:
    get:
      operationId: getProjectContext
      summary: Resolve project-level context without a specific Jira issue
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: query
          name: targetBranch
          required: false
          schema:
            type: string
        - in: query
          name: refresh
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Project-level Effective Context.
          content:
            application/json:
              schema:
                $ref: ../schemas/effective-context.schema.json
        '404':
          description: Project is not registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
