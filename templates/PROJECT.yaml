schema_version: 1

project:
  id: EXAMPLE
  name: Example Project
  status: active
  domain: example
  type: website
  archetype: aws-nextjs-typescript

ownership:
  team: engineering
  technical_owner: team-or-role
  business_owner: team-or-role

jira:
  status: mapped
  project_key: EXAMPLE

repository:
  provider: github
  organization: your-org
  name: your-repository
  default_branch: main

architecture:
  project_adr_location: docs/adr/
  project_bdr_location: docs/bdr/

business_context:
  repository_location: docs/business/
  status: pending_human_review

runtime:
  type: node
  version_source:
    authority: repository
    path: .nvmrc

deployment:
  type: aws # aws | on_prem | none | unknown
  status: unverified
  platform: ecs # example: ecs | docker | none | unknown

environments:
  dev:
    branch: develop
  uat:
    branch: uat
  prod:
    branch: main

contracts:
  api:
    authority: repository
    path: openapi.yaml
  database:
    authority: repository
    path: migrations/

testing:
  policy: policies/testing.md
  api_required: true
  e2e_required: true
  compliance_status: unverified

reporting:
  enabled: false
  # For RPA archetype, set:
  # enabled: true
  # policy: policies/rpa-reporting.md
  # event_schema: schemas/rpa-run-event.schema.json
  # central_reporting_required: true

ai:
  allow:
    read: true
    create_branch: true
    commit: true
    push: true
    create_pr: true
  deny:
    merge: true
    production_deploy: true
    production_credentials: true
